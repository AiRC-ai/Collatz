name: CPU build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Ubuntu / C++20 / CTest
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure CPU build
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCOLLATZ_ENABLE_CUDA=OFF
          -DCOLLATZ_ENABLE_TORCH=OFF

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 120
