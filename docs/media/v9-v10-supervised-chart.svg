<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">New AI models vs original non-AI baseline</title>
<desc id="desc">Neighbor-purity lift (k=2) by label: non-AI raw-metrics baseline vs v9 single-task and v10 multi-task supervised embeddings.</desc>
<defs><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101a33"/><stop offset="1" stop-color="#0b1326"/></linearGradient></defs>
