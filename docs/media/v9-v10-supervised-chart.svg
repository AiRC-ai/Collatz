<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Supervised embedding vs raw-metrics k-NN</title>
<desc id="desc">Neighbor-purity lift (k=2) by label for raw-metrics k-NN, v9 single-task, and v10 multi-task supervised embeddings.</desc>
