<text x="64" y="62" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="800">Supervised embedding beats raw metrics on every coarse label</text>
<text x="64" y="90" fill="#aab6d3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Neighbor-purity lift over random baseline (k=2, 100k trajectories). v10 multi-task trains one 64-d embedding to predict all three labels at once.</text>
