<text x="64" y="90" fill="#aab6d3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Neighbor-purity lift over random baseline (k=2, 100k trajectories, one consistent metric). v10 beats the non-AI baseline on all three labels.</text>
