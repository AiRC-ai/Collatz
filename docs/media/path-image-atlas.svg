<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Collatz path image atlas preview</title>
  <desc id="desc">Static visual preview of representation-first path images: recurrence plot, Gramian Angular Field, Markov Transition Field, and parity raster.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#090e1b"/>
      <stop offset="1" stop-color="#121b33"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#facc15"/>
      <stop offset=".5" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset=".55" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="430" fill="url(#bg)"/>
  <text x="54" y="58" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="800">Path-As-Image Research Views</text>
  <text x="54" y="86" fill="#aab6d3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Collatz trajectories can be encoded as image-like tensors for CNNs, autoencoders, clustering, and anomaly review.</text>

  <g transform="translate(54,120)">
    <rect width="252" height="252" rx="10" fill="#080c18" stroke="#2b385e"/>
    <text x="18" y="30" fill="#dbe7ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="800">Recurrence Plot</text>
    <g transform="translate(30,52)">
      <rect width="192" height="168" fill="#050816"/>
      <g fill="#5eead4" opacity=".9">
        <rect x="0" y="0" width="9" height="9"/><rect x="24" y="24" width="9" height="9"/><rect x="48" y="48" width="9" height="9"/><rect x="72" y="72" width="9" height="9"/><rect x="96" y="96" width="9" height="9"/><rect x="120" y="120" width="9" height="9"/><rect x="144" y="144" width="9" height="9"/>
        <rect x="24" y="0" width="9" height="9"/><rect x="0" y="24" width="9" height="9"/><rect x="72" y="48" width="9" height="9"/><rect x="48" y="72" width="9" height="9"/><rect x="144" y="96" width="9" height="9"/><rect x="96" y="144" width="9" height="9"/>
        <rect x="168" y="24" width="9" height="9"/><rect x="24" y="168" width="9" height="9"/><rect x="132" y="12" width="9" height="9"/><rect x="12" y="132" width="9" height="9"/>
      </g>
      <g fill="#f472b6" opacity=".7">
        <rect x="156" y="156" width="9" height="9"/><rect x="108" y="84" width="9" height="9"/><rect x="84" y="108" width="9" height="9"/><rect x="180" y="60" width="9" height="9"/><rect x="60" y="180" width="9" height="9"/>
      </g>
    </g>
  </g>

  <g transform="translate(333,120)">
    <rect width="252" height="252" rx="10" fill="#080c18" stroke="#2b385e"/>
    <text x="18" y="30" fill="#dbe7ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="800">Gramian Angular Field</text>
    <g transform="translate(30,52)">
      <rect width="192" height="168" fill="#050816"/>
      <path d="M0 168 C32 84, 54 132, 76 56 S140 38, 192 16 L192 168 Z" fill="url(#cool)" opacity=".88"/>
      <path d="M0 168 C28 126, 64 92, 92 116 S144 130, 192 62 L192 168 Z" fill="url(#warm)" opacity=".68"/>
      <path d="M0 126 C52 78, 98 156, 192 36" fill="none" stroke="#e0f2fe" stroke-width="2" opacity=".85"/>
      <path d="M0 94 C42 34, 94 122, 192 10" fill="none" stroke="#fef3c7" stroke-width="1.5" opacity=".6"/>
    </g>
  </g>

  <g transform="translate(612,120)">
    <rect width="252" height="252" rx="10" fill="#080c18" stroke="#2b385e"/>
    <text x="18" y="30" fill="#dbe7ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="800">Markov Transition Field</text>
    <g transform="translate(30,52)">
      <rect width="192" height="168" fill="#050816"/>
      <g stroke-width="0">
        <rect x="0" y="0" width="48" height="42" fill="#172554"/><rect x="48" y="0" width="48" height="42" fill="#075985"/><rect x="96" y="0" width="48" height="42" fill="#0f766e"/><rect x="144" y="0" width="48" height="42" fill="#4d7c0f"/>
        <rect x="0" y="42" width="48" height="42" fill="#6d28d9"/><rect x="48" y="42" width="48" height="42" fill="#1d4ed8"/><rect x="96" y="42" width="48" height="42" fill="#0891b2"/><rect x="144" y="42" width="48" height="42" fill="#ca8a04"/>
        <rect x="0" y="84" width="48" height="42" fill="#be123c"/><rect x="48" y="84" width="48" height="42" fill="#7c3aed"/><rect x="96" y="84" width="48" height="42" fill="#0284c7"/><rect x="144" y="84" width="48" height="42" fill="#16a34a"/>
        <rect x="0" y="126" width="48" height="42" fill="#0f172a"/><rect x="48" y="126" width="48" height="42" fill="#881337"/><rect x="96" y="126" width="48" height="42" fill="#7f1d1d"/><rect x="144" y="126" width="48" height="42" fill="#065f46"/>
      </g>
      <path d="M16 148 L54 110 L94 124 L132 70 L176 28" fill="none" stroke="#f8fafc" stroke-width="2" opacity=".9"/>
      <circle cx="16" cy="148" r="4" fill="#facc15"/><circle cx="54" cy="110" r="4" fill="#facc15"/><circle cx="94" cy="124" r="4" fill="#facc15"/><circle cx="132" cy="70" r="4" fill="#facc15"/><circle cx="176" cy="28" r="4" fill="#facc15"/>
    </g>
  </g>

  <g transform="translate(891,120)">
    <rect width="252" height="252" rx="10" fill="#080c18" stroke="#2b385e"/>
    <text x="18" y="30" fill="#dbe7ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="800">Parity Raster</text>
    <g transform="translate(30,52)">
      <rect width="192" height="168" fill="#050816"/>
      <g>
        <rect x="0" y="0" width="12" height="12" fill="#5eead4"/><rect x="12" y="0" width="12" height="12" fill="#f472b6"/><rect x="24" y="0" width="12" height="12" fill="#f472b6"/><rect x="36" y="0" width="12" height="12" fill="#5eead4"/><rect x="48" y="0" width="12" height="12" fill="#f472b6"/><rect x="60" y="0" width="12" height="12" fill="#5eead4"/><rect x="72" y="0" width="12" height="12" fill="#5eead4"/><rect x="84" y="0" width="12" height="12" fill="#f472b6"/>
        <rect x="0" y="24" width="12" height="12" fill="#f472b6"/><rect x="12" y="24" width="12" height="12" fill="#5eead4"/><rect x="24" y="24" width="12" height="12" fill="#5eead4"/><rect x="36" y="24" width="12" height="12" fill="#f472b6"/><rect x="48" y="24" width="12" height="12" fill="#5eead4"/><rect x="60" y="24" width="12" height="12" fill="#f472b6"/><rect x="72" y="24" width="12" height="12" fill="#f472b6"/><rect x="84" y="24" width="12" height="12" fill="#5eead4"/>
        <rect x="96" y="48" width="12" height="12" fill="#f472b6"/><rect x="108" y="48" width="12" height="12" fill="#f472b6"/><rect x="120" y="48" width="12" height="12" fill="#5eead4"/><rect x="132" y="48" width="12" height="12" fill="#5eead4"/><rect x="144" y="48" width="12" height="12" fill="#f472b6"/><rect x="156" y="48" width="12" height="12" fill="#5eead4"/><rect x="168" y="48" width="12" height="12" fill="#f472b6"/><rect x="180" y="48" width="12" height="12" fill="#5eead4"/>
        <rect x="36" y="72" width="12" height="12" fill="#5eead4"/><rect x="48" y="72" width="12" height="12" fill="#f472b6"/><rect x="60" y="72" width="12" height="12" fill="#5eead4"/><rect x="72" y="72" width="12" height="12" fill="#f472b6"/><rect x="84" y="72" width="12" height="12" fill="#5eead4"/><rect x="96" y="72" width="12" height="12" fill="#5eead4"/><rect x="108" y="72" width="12" height="12" fill="#f472b6"/>
        <rect x="0" y="108" width="12" height="12" fill="#5eead4"/><rect x="12" y="108" width="12" height="12" fill="#5eead4"/><rect x="24" y="108" width="12" height="12" fill="#f472b6"/><rect x="36" y="108" width="12" height="12" fill="#5eead4"/><rect x="48" y="108" width="12" height="12" fill="#f472b6"/><rect x="60" y="108" width="12" height="12" fill="#f472b6"/>
      </g>
      <text x="0" y="154" fill="#aab6d3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">even / odd run texture</text>
    </g>
  </g>

  <text x="54" y="404" fill="#7384ad" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">These are representation examples, not mathematical proof. They are used to compare path families, clusters, and anomalies.</text>
</svg>
