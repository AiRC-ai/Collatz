<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Collatz evidence dashboard snapshot</title>
  <desc id="desc">Static public README snapshot rendered from the canonical public evidence JSON.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#121a34"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#facc15"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1200" height="680" fill="#080d1a"/>
  <text x="64" y="66" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="800">3xN1 Collatz Evidence Dashboard</text>
  <text x="64" y="96" fill="#aab6d3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Generated from data/generated/evidence/latest_public_summary.json. No live runtime or infrastructure details are shown.</text>

  <g filter="url(#softShadow)">
    <rect x="64" y="132" width="260" height="118" rx="10" fill="url(#panel)" stroke="#2b385e"/>
    <text x="84" y="162" fill="#9fb0d4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">CONFIDENCE</text>
    <text x="84" y="202" fill="#e2e8f0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="800">range-stable signal</text>
    <text x="84" y="226" fill="#86efac" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">empirical, not proof</text>

    <rect x="348" y="132" width="260" height="118" rx="10" fill="url(#panel)" stroke="#2b385e"/>
    <text x="368" y="162" fill="#9fb0d4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">AUDIT</text>
    <text x="368" y="202" fill="#e2e8f0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="800">480M</text>
    <text x="458" y="202" fill="#aab6d3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">rows</text>
    <text x="368" y="226" fill="#aab6d3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">range 1..480,000,000</text>

    <rect x="632" y="132" width="260" height="118" rx="10" fill="url(#panel)" stroke="#2b385e"/>
    <text x="652" y="162" fill="#9fb0d4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">SOURCE CHECK</text>
    <text x="652" y="202" fill="#e2e8f0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="800">5,086 / 5,191</text>
    <text x="652" y="226" fill="#aab6d3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">97.977% public targets matched</text>

    <rect x="916" y="132" width="220" height="118" rx="10" fill="url(#panel)" stroke="#2b385e"/>
    <text x="936" y="162" fill="#9fb0d4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">LIMIT</text>
    <text x="936" y="199" fill="#facc15" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="800">not a proof</text>
    <text x="936" y="224" fill="#aab6d3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">gate blockers remain</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="64" y="278" width="520" height="310" rx="10" fill="url(#panel)" stroke="#2b385e"/>
    <text x="88" y="314" fill="#e2e8f0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="800">Neural Evidence</text>
    <text x="88" y="338" fill="#aab6d3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Lift values compare learned neighborhoods against controlled baselines.</text>

    <text x="88" y="384" fill="#dbe7ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Best ablation: metrics-only</text>
    <rect x="88" y="398" width="372" height="18" rx="9" fill="#1f2a44"/>
    <rect x="88" y="398" width="323" height="18" rx="9" fill="url(#green)"/>
    <text x="474" y="413" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="800">12.507%</text>

    <text x="88" y="444" fill="#dbe7ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Hybrid representation</text>
    <rect x="88" y="458" width="372" height="18" rx="9" fill="#1f2a44"/>
    <rect x="88" y="458" width="264" height="18" rx="9" fill="#60a5fa"/>
    <text x="474" y="473" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="800">10.244%</text>

    <text x="88" y="504" fill="#dbe7ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Weakest range holdout</text>
    <rect x="88" y="518" width="372" height="18" rx="9" fill="#1f2a44"/>
    <rect x="88" y="518" width="201" height="18" rx="9" fill="#a78bfa"/>
    <text x="474" y="533" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="800">7.804%</text>
    <text x="88" y="562" fill="#86efac" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="800">Numeric-adjacency lift: 5.332%</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="616" y="278" width="520" height="310" rx="10" fill="url(#panel)" stroke="#2b385e"/>
    <text x="640" y="314" fill="#e2e8f0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="800">Current Finding</text>
    <text x="640" y="342" fill="#aab6d3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">metrics-only is currently strongest at 12.507%, while hybrid</text>
    <text x="640" y="362" fill="#aab6d3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">is 10.244%. This keeps the interpretation metric-dominant.</text>

    <rect x="640" y="374" width="448" height="64" rx="8" fill="#070b16" stroke="#263450"/>
    <text x="660" y="400" fill="#9fb0d4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">COVERAGE</text>
    <text x="660" y="424" fill="#dbe7ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Topology 100,000 rows (0.021%); stratified sample 109,031 rows (0.023%).</text>

    <rect x="640" y="456" width="448" height="64" rx="8" fill="#070b16" stroke="#263450"/>
    <text x="660" y="482" fill="#9fb0d4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">PROMOTION BLOCKERS</text>
    <text x="660" y="504" fill="#facc15" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">oeis_source_family_incomplete,</text>
    <text x="660" y="522" fill="#facc15" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">non_oeis_source_families_incomplete, +5 more</text>

    <rect x="640" y="540" width="448" height="1" fill="#263450"/>
    <text x="640" y="566" fill="#e2e8f0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="800">Next falsification test</text>
    <text x="640" y="590" fill="#aab6d3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Classify unmatched source targets, expand non-OEIS source imports, then</text>
    <text x="640" y="607" fill="#aab6d3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">rerun source-neighborhood, path-image, GNN, and matched-control</text>
    <text x="640" y="624" fill="#aab6d3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">ablations.</text>
  </g>

  <text x="64" y="642" fill="#7384ad" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">Generated at 2026-05-20T16:24:42Z from public-safe canonical evidence. Operations telemetry never raises confidence.</text>
</svg>
